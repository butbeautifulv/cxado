# Egregore data plane (postgres, redis, qdrant) on cxado-net.
name: cxado-egregore

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: egregore
    ports:
      - "5432:5432"
    volumes:
      - cxado_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cxado-net

  redis:
    image: redis:7
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - cxado_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cxado-net

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - cxado_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cxado-net

  openfga:
    image: openfga/openfga:latest
    profiles: ["fga"]
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_LOG_FORMAT: json
    ports:
      - "8088:8080"
      - "8089:8081"
      - "3008:3000"
    networks:
      - cxado-net

networks:
  cxado-net:
    external: true
    name: cxado-net

volumes:
  cxado_postgres_data:
  cxado_redis_data:
  cxado_qdrant_data:
