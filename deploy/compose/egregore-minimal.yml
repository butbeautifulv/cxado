# Minimal egregore data plane: postgres + redis only (no qdrant, no kafka).
name: cxado-egregore-minimal

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: egregore
    ports:
      - "5432:5432"
    volumes:
      - cxado_minimal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - cxado-net

  redis:
    image: redis:7
    command: redis-server --requirepass password --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - cxado_minimal_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - cxado-net

networks:
  cxado-net:
    external: true
    name: cxado-net

volumes:
  cxado_minimal_postgres:
  cxado_minimal_redis:
