apiVersion: 1

groups:
  - orgId: 1
    name: veil-observability
    folder: Veil
    interval: 1m
    rules:
      - uid: veil-api-down
        title: Veil API Down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="veil-api"}
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 2m
        annotations:
          summary: Veil API is down
        labels:
          platform: veil
          severity: critical
