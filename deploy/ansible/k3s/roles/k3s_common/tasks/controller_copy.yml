---
- name: Stat k3s binary on controller
  ansible.builtin.stat:
    path: "{{ k3s_airgap_binary_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: k3s_binary_stat

- name: Stat k3s install script on controller
  ansible.builtin.stat:
    path: "{{ k3s_airgap_install_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: k3s_install_stat

- name: Stat k3s airgap images tarball on controller
  ansible.builtin.stat:
    path: "{{ k3s_airgap_images_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: k3s_images_tar_stat

- name: Stat k3s airgap images zst tarball on controller
  ansible.builtin.stat:
    path: "{{ k3s_airgap_images_zst_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: k3s_images_zst_stat

- name: Fail when required airgap artifacts are missing on controller
  ansible.builtin.fail:
    msg: >-
      Missing airgap artifacts under {{ k3s_airgap_dir }}.
      Run scripts/k8s/k3s-airgap-fetch.sh on the Ansible controller first.
  when: >-
    not k3s_binary_stat.stat.exists
    or not k3s_install_stat.stat.exists
    or (not k3s_images_tar_stat.stat.exists and not k3s_images_zst_stat.stat.exists)
  run_once: true

- name: Copy k3s binary to node
  ansible.builtin.copy:
    src: "{{ k3s_airgap_binary_src }}"
    dest: "{{ k3s_airgap_staging_dir }}/k3s"
    mode: "0755"

- name: Copy k3s install script to node
  ansible.builtin.copy:
    src: "{{ k3s_airgap_install_src }}"
    dest: "{{ k3s_airgap_staging_dir }}/install.sh"
    mode: "0755"

- name: Copy k3s airgap images tarball to node
  ansible.builtin.copy:
    src: "{{ k3s_airgap_images_src }}"
    dest: "{{ k3s_airgap_staging_dir }}/k3s-airgap-images-{{ k3s_airgap_arch }}.tar"
    mode: "0644"
  when: k3s_images_tar_stat.stat.exists

- name: Copy k3s airgap images zst tarball to node
  ansible.builtin.copy:
    src: "{{ k3s_airgap_images_zst_src }}"
    dest: "{{ k3s_airgap_staging_dir }}/k3s-airgap-images-{{ k3s_airgap_arch }}.tar.zst"
    mode: "0644"
  when: not k3s_images_tar_stat.stat.exists and k3s_images_zst_stat.stat.exists
