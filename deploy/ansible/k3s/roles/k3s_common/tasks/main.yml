---
- name: Resolve k3s airgap architecture suffix
  ansible.builtin.set_fact:
    k3s_airgap_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Define expected airgap artifact paths on controller
  ansible.builtin.set_fact:
    k3s_airgap_binary_src: >-
      {{ k3s_airgap_dir }}/{{ 'k3s-arm64' if k3s_airgap_arch == 'arm64' else 'k3s' }}
    k3s_airgap_install_src: "{{ k3s_airgap_dir }}/install.sh"
    k3s_airgap_images_src: "{{ k3s_airgap_dir }}/k3s-airgap-images-{{ k3s_airgap_arch }}.tar"
    k3s_airgap_images_zst_src: "{{ k3s_airgap_dir }}/k3s-airgap-images-{{ k3s_airgap_arch }}.tar.zst"

- name: Create airgap staging directory on node
  ansible.builtin.file:
    path: "{{ k3s_airgap_staging_dir }}"
    state: directory
    mode: "0755"

- name: Pull k3s airgap artifacts from Nexus
  ansible.builtin.include_tasks: nexus_fetch.yml
  when: k3s_airgap_source == 'nexus'

- name: Copy k3s airgap artifacts from Ansible controller
  ansible.builtin.include_tasks: controller_copy.yml
  when: k3s_airgap_source != 'nexus'

- name: Install k3s binary on PATH for install.sh and kubectl checks
  ansible.builtin.copy:
    src: "{{ k3s_airgap_staging_dir }}/k3s"
    dest: /usr/local/bin/k3s
    mode: "0755"
    remote_src: true

- name: Install k3s systemd network-online drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"

- name: Install k3s systemd network-online drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/override.conf
    mode: "0644"
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do ip route | grep -q "^default" && exit 0; sleep 2; done; exit 1'
  notify: Reload systemd

- name: Install k3s-agent systemd network-online drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    mode: "0755"

- name: Install k3s-agent systemd network-online drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/override.conf
    mode: "0644"
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do ip route | grep -q "^default" && exit 0; sleep 2; done; exit 1'
  notify: Reload systemd
