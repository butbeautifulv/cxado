---
- name: Detect k3s binary path
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v k3s >/dev/null 2>&1; then
      command -v k3s
    elif [ -x /usr/local/bin/k3s ]; then
      echo /usr/local/bin/k3s
    else
      echo missing
    fi
  register: k3s_ci_bin_detect
  changed_when: false

- name: Set k3s binary fact
  ansible.builtin.set_fact:
    k3s_ci_bin: "{{ k3s_ci_bin_detect.stdout | trim }}"

- name: Fail when k3s binary missing
  ansible.builtin.fail:
    msg: "k3s binary not found on {{ inventory_hostname }}"
  when: k3s_ci_bin == 'missing'

- name: Ensure CI image tar export directory on control plane
  ansible.builtin.file:
    path: "{{ k3s_ci_tar_dir }}"
    state: directory
    mode: "0755"

- name: Export CI image tars on control plane
  ansible.builtin.shell: |
    set -euo pipefail
    K3S="{{ k3s_ci_bin | default('/usr/local/bin/k3s') }}"
    REF="{{ nexus_docker_registry }}/{{ nexus_docker_repo }}/{{ item }}"
    TAR="{{ k3s_ci_tar_dir }}/{{ item | replace(':', '_') | replace('/', '_') }}.tar"
    if [[ -s "${TAR}" ]]; then
      echo "tar-present: ${TAR}"
      exit 0
    fi
    if ! ${K3S} ctr images ls 2>/dev/null | grep -Fq "{{ item }}"; then
      echo "missing on control plane: ${REF}" >&2
      exit 1
    fi
    ${K3S} ctr images export "${TAR}" "${REF}"
    echo "exported: ${TAR}"
  args:
    executable: /bin/bash
  loop: "{{ k3s_ci_export_tags }}"
  register: k3s_ci_export
  changed_when: "'exported:' in k3s_ci_export.stdout"
  become: true
