---
- name: Resolve helm airgap architecture suffix
  ansible.builtin.set_fact:
    helm_airgap_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Define helm tarball path on controller
  ansible.builtin.set_fact:
    helm_airgap_tarball_src: "{{ k3s_airgap_dir }}/helm-{{ helm_version }}-linux-{{ helm_airgap_arch }}.tar.gz"

- name: Stat helm tarball on controller
  ansible.builtin.stat:
    path: "{{ helm_airgap_tarball_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: helm_tarball_stat

- name: Fail when helm tarball is missing
  ansible.builtin.fail:
    msg: >-
      Missing helm tarball {{ helm_airgap_tarball_src }}.
      Run scripts/k8s/k3s-airgap-fetch.sh on the Ansible controller first.
  when: not helm_tarball_stat.stat.exists
  run_once: true

- name: Copy helm tarball to node
  ansible.builtin.copy:
    src: "{{ helm_airgap_tarball_src }}"
    dest: "/tmp/helm-{{ helm_version }}-linux-{{ helm_airgap_arch }}.tar.gz"
    mode: "0644"

- name: Extract helm binary
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}-linux-{{ helm_airgap_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/linux-{{ helm_airgap_arch }}/helm"

- name: Install helm binary
  ansible.builtin.copy:
    src: "/tmp/linux-{{ helm_airgap_arch }}/helm"
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true

- name: Verify helm installation
  ansible.builtin.command: helm version
  register: helm_version_out
  changed_when: false

- name: Show helm version
  ansible.builtin.debug:
    msg: "{{ helm_version_out.stdout }}"
