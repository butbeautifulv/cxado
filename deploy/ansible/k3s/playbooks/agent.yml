---
- name: Fetch cluster join token from control plane
  hosts: k3s_server
  gather_facts: false
  tasks:
    - name: Read k3s node token from server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_raw

    - name: Publish cluster join facts for agents
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_node_token_raw.content | b64decode | trim }}"
        k3s_server_host: "{{ k3s_node_ip }}"

- name: Prepare worker node (common prep)
  hosts: k3s_agent
  gather_facts: true
  roles:
    - cxado_common
    - cxado_ssh
    - k3s_common
    - k3s_hostpaths

- name: Join k3s worker nodes
  hosts: k3s_agent
  gather_facts: false
  roles:
    - k3s_agent
