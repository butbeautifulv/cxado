---
- name: Bootstrap k3s nodes (common prep)
  hosts: k3s_server:k3s_agent
  gather_facts: true
  roles:
    - cxado_common
    - cxado_ssh
    - k3s_common
    - k3s_hostpaths

- name: Bootstrap k3s control plane
  hosts: k3s_server
  gather_facts: false
  roles:
    - k3s_server
    - helm
    - k3s_kubeconfig

- name: Join k3s worker nodes
  hosts: k3s_agent
  gather_facts: false
  roles:
    - k3s_agent
