grafana:
  enabled: true
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: egregore-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - egregore-api.cxado-app.svc.cluster.local:8080
      - job_name: veil-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - veil-api.veil.svc.cluster.local:8090
      - job_name: veil-mcp
        metrics_path: /metrics
        static_configs:
          - targets:
              - veil-mcp.veil.svc.cluster.local:8091
      - job_name: vllm
        metrics_path: /metrics
        scrape_interval: 10s
        scrape_timeout: 10s
        honor_labels: true
        static_configs:
          - targets:
              - 10.8.185.186:11612
            labels:
              service: vllm
              platform: vllm
              component: inference-server
              host: proxmox-gpu
      - job_name: proxmox-gpu-node
        static_configs:
          - targets:
              - 10.8.185.186:9100
            labels:
              service: node-exporter
              platform: proxmox
              component: gpu-host
              instance: proxmox-gpu
      - job_name: proxmox-gpu-dcgm
        static_configs:
          - targets:
              - 10.8.185.186:9400
            labels:
              service: dcgm-exporter
              platform: proxmox
              component: gpu-telemetry
              instance: proxmox-gpu

alertmanager:
  enabled: false
