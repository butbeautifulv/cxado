apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-config
  namespace: cxado-ci
  labels:
    app.kubernetes.io/name: gitlab-runner
data:
  config.toml: |
    concurrent = 4
    check_interval = 3
    log_level = "info"

    [session_server]
      session_timeout = 1800

    [[runners]]
      name = "cxado-k8s"
      url = "https://gitlab.svo.aero/"
      token = "__RUNNER_TOKEN__"
      executor = "kubernetes"
      run_untagged = false
      [runners.custom_build_dir]
      [runners.cache]
        Type = "s3"
        Shared = false
      [runners.kubernetes]
        namespace = "cxado-ci"
        image = "__CXADO_CI_REGISTRY__/alpine:3.20.3"
        privileged = false
        poll_timeout = 600
        pull_policy = "if-not-present"
        image_pull_secrets = ["nexus-registry"]
        helper_image = "__CXADO_CI_REGISTRY__/gitlab-runner-helper:x86_64-v19.1.1"
        cpu_request = "250m"
        cpu_limit = "2"
        memory_request = "512Mi"
        memory_limit = "4Gi"
        service_account = "gitlab-runner"
        [runners.kubernetes.pod_annotations]
          "cluster-autoscaler.kubernetes.io/safe-to-evict" = "false"
        [[runners.kubernetes.volumes.secret]]
          name = "nexus-ca-cert"
          mount_path = "/etc/ssl/certs/nexus"
          read_only = true
        [[runners.kubernetes.volumes.secret]]
          name = "nexus-registry"
          mount_path = "/kaniko/.docker"
          read_only = true
  configure-runner.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    CFG_SRC="/config/config.toml"
    CFG_DST="/etc/gitlab-runner/config.toml"
    if [[ -z "${RUNNER_TOKEN:-}" ]]; then
      echo "missing RUNNER_TOKEN env (gitlab-runner-token secret)" >&2
      exit 2
    fi
    sed "s|__RUNNER_TOKEN__|${RUNNER_TOKEN}|g" "${CFG_SRC}" > "${CFG_DST}"
    exec gitlab-runner run --user=gitlab-runner --working-directory=/home/gitlab-runner
