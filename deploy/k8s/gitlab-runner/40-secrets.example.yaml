# Copy to 40-secrets.yaml (gitignored) or create via setup-runner-k8s.sh bootstrap.
#
#   kubectl -n cxado-ci create secret generic gitlab-runner-token \
#     --from-literal=runner-token='glrt-...'
#
# Nexus pull secrets are created by scripts/gitlab/setup-runner-k8s.sh bootstrap
# (same pattern as kaniko-bootstrap: nexus-registry + nexus-ca-cert).
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-runner-token
  namespace: cxado-ci
type: Opaque
stringData:
  runner-token: "REPLACE_WITH_glrt_TOKEN"
