apiVersion: v1
kind: ConfigMap
metadata:
  name: cxado-tls-gateway-nginx
  namespace: cxado-edge
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_session_cache shared:SSL:10m;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_max_body_size 50m;

      server {
        listen 30300 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://egregore-ui.cxado-app.svc.cluster.local:3000;
        }
      }

      server {
        listen 30880 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://egregore-api.cxado-app.svc.cluster.local:8080;
        }
      }

      server {
        listen 30990 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://veil-veil-api.veil.svc.cluster.local:8090;
        }
      }

      server {
        listen 30991 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://veil-veil-mcp.veil.svc.cluster.local:8091;
        }
      }

      server {
        listen 30474 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://neo4j.cxado-data.svc.cluster.local:7474;
        }
      }

      server {
        listen 30080 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://cxado-arch-docs.cxado-edge.svc.cluster.local:80;
        }
      }

      server {
        listen 30002 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://grafana.cxado-obs.svc.cluster.local:3000;
        }
      }

      server {
        listen 30091 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://prometheus.cxado-obs.svc.cluster.local:9090;
        }
      }

      server {
        listen 30001 ssl;
        error_page 497 =301 https://$http_host$request_uri;
        location / {
          proxy_pass http://langfuse-web.cxado-langfuse.svc.cluster.local:3000;
        }
      }
    }
