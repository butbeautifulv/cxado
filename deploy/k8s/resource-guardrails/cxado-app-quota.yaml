# Namespace-level caps for cxado-app (egregore + siem-mcp + tenable-mcp).
# 3-node offline cluster: api×4 + worker×8 + ui×2 — see k3s-capacity-budget.md
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cxado-app-cap
  namespace: cxado-app
spec:
  hard:
    pods: "35"
    requests.cpu: "6000m"
    requests.memory: 12Gi
    limits.cpu: "16000m"
    limits.memory: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cxado-app-defaults
  namespace: cxado-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 768Mi
      max:
        cpu: "2"
        memory: 2Gi
