apiVersion: apps/v1
kind: Deployment
metadata:
  name: egregore-ui-minimal
  namespace: cxado-edge
  labels:
    app: egregore-ui-minimal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egregore-ui-minimal
  template:
    metadata:
      labels:
        app: egregore-ui-minimal
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: docker.io/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: site
          hostPath:
            path: /home/bbv/cxado/ui-minimal
            type: Directory
        - name: nginx-config
          configMap:
            name: egregore-ui-minimal-nginx
