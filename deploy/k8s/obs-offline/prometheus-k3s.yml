global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: cxado-k3s
    env: offline
    veil_profile: graph-only

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter.cxado-obs.svc.cluster.local:9100"]
        labels:
          service: node-exporter

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.cxado-obs.svc.cluster.local:8080"]
        labels:
          service: kube-state-metrics

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo.cxado-obs.svc.cluster.local:3200"]
        labels:
          service: tempo

  - job_name: loki
    static_configs:
      - targets: ["loki.cxado-obs.svc.cluster.local:3100"]
        labels:
          service: loki

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana.cxado-obs.svc.cluster.local:3000"]
        labels:
          service: grafana
          component: observability

  - job_name: egregore-api
    metrics_path: /metrics
    static_configs:
      - targets: ["egregore-api.cxado-app.svc.cluster.local:8080"]
        labels:
          service: egregore-api
          platform: egregore
          component: ingress

  - job_name: egregore-worker
    metrics_path: /metrics
    scrape_interval: 15s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cxado-app]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: egregore-worker
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: job
        replacement: egregore-worker
      - target_label: service
        replacement: egregore-worker
      - target_label: platform
        replacement: egregore
      - target_label: component
        replacement: worker

  - job_name: egregore-dispatcher
    metrics_path: /metrics
    scrape_interval: 15s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cxado-app]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: egregore-dispatcher
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: job
        replacement: egregore-dispatcher
      - target_label: service
        replacement: egregore-dispatcher
      - target_label: platform
        replacement: egregore
      - target_label: component
        replacement: dispatcher

  - job_name: veil-api
    metrics_path: /metrics
    static_configs:
      - targets: ["veil-veil-api.veil.svc.cluster.local:8090"]
        labels:
          service: veil-api
          platform: veil
          component: graph-api

  - job_name: veil-mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["veil-veil-mcp.veil.svc.cluster.local:8091"]
        labels:
          service: veil-mcp
          platform: veil
          component: mcp

  # Veil background workers: gated by CXADO_VEIL_PROFILE=workers-obs
  # (see prometheus-k3s-veil-workers-scrape.yaml + obs-create-configmaps.sh)

  # External vLLM on phy-gpu-host01 (10.8.185.185).
  # OpenAI API: http://10.8.185.185:11611/v1  |  metrics: /metrics on the same port.
  # Requires network reachability from the k3s node (10.8.185.15) to 10.8.185.185:11611.
  - job_name: vllm
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 10s
    honor_labels: true
    static_configs:
      - targets: ["10.8.185.185:11611"]
        labels:
          service: vllm
          platform: vllm
          component: inference-server
          host: phy-gpu-host01

  # LMCache MP server on phy-gpu-host01 (HTTP :8080, Prometheus :9090).
  - job_name: lmcache
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["10.8.185.185:9090"]
        labels:
          service: lmcache
          platform: lmcache
          component: kv-cache-server
          host: phy-gpu-host01

  # phy-gpu-host01 — node-exporter (host CPU/RAM/disk). Install on 10.8.185.185:9100.
  - job_name: proxmox-gpu-node
    scrape_interval: 15s
    static_configs:
      - targets: ["10.8.185.185:9100"]
        labels:
          service: node-exporter
          platform: proxmox
          component: gpu-host
          instance: phy-gpu-host01

  # phy-gpu-host01 — NVIDIA DCGM exporter (GPU util / VRAM). Install on 10.8.185.185:9400.
  - job_name: proxmox-gpu-dcgm
    scrape_interval: 15s
    static_configs:
      - targets: ["10.8.185.185:9400"]
        labels:
          service: dcgm-exporter
          platform: proxmox
          component: gpu-telemetry
          instance: phy-gpu-host01
