apiVersion: v1
kind: Service
metadata:
  name: defectdojo-postgres
  namespace: cxado-data
  labels:
    app: defectdojo-postgres
spec:
  selector:
    app: defectdojo-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defectdojo-postgres
  namespace: cxado-data
  labels:
    app: defectdojo-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: defectdojo-postgres
  template:
    metadata:
      labels:
        app: defectdojo-postgres
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: nexus-registry
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgres
          image: nexus.svo.aero:8345/cxado-docker/postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: defectdojo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: defectdojo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U defectdojo -d defectdojo"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U defectdojo -d defectdojo"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: defectdojo-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: defectdojo-postgres-data
  namespace: cxado-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
