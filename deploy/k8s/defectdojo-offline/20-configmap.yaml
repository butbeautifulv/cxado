apiVersion: v1
kind: ConfigMap
metadata:
  name: defectdojo-config
  namespace: cxado-aspm
data:
  DD_DEBUG: "False"
  DD_DJANGO_METRICS_ENABLED: "False"
  DD_ALLOWED_HOSTS: "defectdojo.cxado-aspm.svc.cluster.local,defectdojo.cxado-aspm,localhost,127.0.0.1,*"
  DD_DATABASE_READINESS_TIMEOUT: "60"
  DD_DATABASE_HOST: "defectdojo-postgres.cxado-data.svc.cluster.local"
  DD_DATABASE_PORT: "5432"
  DD_DATABASE_USER: "defectdojo"
  DD_DATABASE_NAME: "defectdojo"
  DD_CELERY_BROKER_URL: "redis://defectdojo-redis.cxado-aspm.svc.cluster.local:6379/0"
  DD_ADMIN_USER: "admin"
  DD_ADMIN_MAIL: "admin@cxado.local"
  DD_ADMIN_FIRST_NAME: "Admin"
  DD_ADMIN_LAST_NAME: "Cxado"
  DD_INITIALIZE: "true"
  DD_UWSGI_HOST: "defectdojo-uwsgi.cxado-aspm.svc.cluster.local"
  DD_UWSGI_PORT: "3031"
  NGINX_METRICS_ENABLED: "false"
