# Copy to defectdojo-secrets (gitignored apply via k3s-deploy-defectdojo.sh).
#
# Runtime secrets are generated by ./scripts/k8s/k3s-deploy-defectdojo.sh from
# deploy/.secrets/cxado-k3s.env (or random values when unset).
#
# Manual apply (cxado-aspm — full app secrets):
#   kubectl -n cxado-aspm create secret generic defectdojo-secrets \
#     --from-literal=postgres-password='...' \
#     --from-literal=secret-key='...' \
#     --from-literal=credential-aes-key='...' \
#     --from-literal=admin-password='...' \
#     --from-literal=database-url='postgresql://defectdojo:...@defectdojo-postgres.cxado-data.svc.cluster.local:5432/defectdojo'
#
# Manual apply (cxado-data — postgres pod only):
#   kubectl -n cxado-data create secret generic defectdojo-secrets \
#     --from-literal=postgres-password='...'
apiVersion: v1
kind: Secret
metadata:
  name: defectdojo-secrets
  namespace: cxado-aspm
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_dd_pg"
  secret-key: "CHANGE_ME_dd_secret_key_min_50_chars________________"
  credential-aes-key: "CHANGE_ME_aes_32_chars___________"
  admin-password: "CHANGE_ME_admin"
  database-url: "postgresql://defectdojo:CHANGE_ME_dd_pg@defectdojo-postgres.cxado-data.svc.cluster.local:5432/defectdojo"
---
apiVersion: v1
kind: Secret
metadata:
  name: defectdojo-secrets
  namespace: cxado-data
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_dd_pg"
