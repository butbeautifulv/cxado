apiVersion: apps/v1
kind: Deployment
metadata:
  name: defectdojo-nginx
  namespace: cxado-aspm
  labels:
    app: defectdojo-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: defectdojo-nginx
  template:
    metadata:
      labels:
        app: defectdojo-nginx
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: nexus-registry
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nexus.svo.aero:8345/cxado-docker/defectdojo-nginx:2.50.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: defectdojo-config
          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/html/media
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: defectdojo-media
---
apiVersion: v1
kind: Service
metadata:
  name: defectdojo
  namespace: cxado-aspm
  labels:
    app: defectdojo
spec:
  selector:
    app: defectdojo-nginx
  ports:
    - name: http
      port: 8080
      targetPort: 8080
