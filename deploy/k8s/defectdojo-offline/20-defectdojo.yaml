apiVersion: v1
kind: Service
metadata:
  name: defectdojo-uwsgi
  namespace: cxado-aspm
  labels:
    app: defectdojo-uwsgi
spec:
  selector:
    app: defectdojo-uwsgi
  ports:
    - name: uwsgi
      port: 3031
      targetPort: 3031
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defectdojo-uwsgi
  namespace: cxado-aspm
  labels:
    app: defectdojo-uwsgi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: defectdojo-uwsgi
  template:
    metadata:
      labels:
        app: defectdojo-uwsgi
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: nexus-registry
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: uwsgi
          image: nexus.svo.aero:8345/cxado-docker/defectdojo-django:2.50.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              /wait-for-it.sh "${DD_DATABASE_HOST}:${DD_DATABASE_PORT}" -t 120 -- /entrypoint-uwsgi.sh
          ports:
            - containerPort: 3031
          envFrom:
            - configMapRef:
                name: defectdojo-config
          env:
            - name: DD_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: postgres-password
            - name: DD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: database-url
            - name: DD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: secret-key
            - name: DD_CREDENTIAL_AES_256_KEY
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: credential-aes-key
          volumeMounts:
            - name: media
              mountPath: /app/media
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 3031
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3031
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: defectdojo-media
---
