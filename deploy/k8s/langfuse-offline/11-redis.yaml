apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cxado-langfuse
spec:
  selector:
    app: langfuse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cxado-langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: docker.io/library/redis:7
          imagePullPolicy: IfNotPresent
          args:
            - "redis-server"
            - "--requirepass"
            - "$(REDIS_AUTH)"
            - "--maxmemory-policy"
            - "noeviction"
          env:
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: redis-auth
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_AUTH\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-redis-data
  namespace: cxado-langfuse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
