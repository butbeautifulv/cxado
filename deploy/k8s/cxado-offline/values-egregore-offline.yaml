image:
  repository: "__CXADO_API_IMAGE_REPO__"
  tag: "__CXADO_OFFLINE_TAG__"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: nexus-registry

ui:
  image:
    repository: "__CXADO_UI_IMAGE_REPO__"
    tag: "__CXADO_OFFLINE_TAG__"
    pullPolicy: IfNotPresent
  replicas: 2

api:
  image:
    repository: "__CXADO_API_IMAGE_REPO__"
    tag: "__CXADO_OFFLINE_TAG__"
    pullPolicy: IfNotPresent
  replicas: 3
  port: 8080
  uvicornWorkers: 3

dispatcher:
  enabled: true
  image:
    repository: "__CXADO_DISPATCHER_IMAGE_REPO__"
    tag: "__CXADO_OFFLINE_TAG__"
    pullPolicy: IfNotPresent
  replicas: 2
  idleTimeout: 0
  metricsPort: 8081

agentRuntime:
  image:
    repository: "__CXADO_AGENT_RUNTIME_IMAGE_REPO__"
    tag: "__CXADO_OFFLINE_TAG__"
    pullPolicy: IfNotPresent

toolGateway:
  enabled: true
  image:
    repository: "__CXADO_TOOL_GATEWAY_IMAGE_REPO__"
    tag: "__CXADO_OFFLINE_TAG__"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8092

worker:
  replicas: 0
  idleTimeout: 0
  metricsPort: 8081
  hpa:
    enabled: false
    minReplicas: 0
    maxReplicas: 0
    targetCPUUtilization: 65

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: DoNotSchedule

rollout:
  api:
    maxSurge: 2
    maxUnavailable: 1
  dispatcher:
    maxSurge: 1
    maxUnavailable: 1
  worker:
    maxSurge: 1
    maxUnavailable: 2
  toolGateway:
    maxSurge: 1
    maxUnavailable: 0

env:
  stage: prod
  useMemoryFallback: "false"
  useKafka: "true"
  kafkaBootstrapServers: "redpanda.cxado-data.svc.cluster.local:9092"
  useQdrant: "true"
  authEnabled: "false"
  authzMode: "off"

# Prod profile (enable via helm -f values-egregore-prod-auth.yaml):
#   authEnabled: "true"
#   authzMode: "shadow"
  openfgaApiUrl: ""
  openfgaStoreId: ""
  openfgaModelId: ""
  otelEnabled: "true"
  logLevel: "INFO"
  logFormat: "json"
  litellmLocalModelCostMap: "true"
  traceCriticEnabled: "false"
  llmRequestTimeout: "120"
  workerJobTimeout: "300"
  workerJobTimeoutIntel: "420"
  workerJobTimeoutSynth: "300"
  defaultJobRecursionLimit: "35"
  triageRecursionLimit: "22"
  maxPlannerPersonas: "2"
  jsonToolCallFallback: "true"
  manualInvestigationAsync: "true"
  uiCorsOrigins: "https://192.168.0.133:30300,https://10.8.185.15:30300,https://localhost:30300,https://192.168.0.133:30301,https://10.8.185.15:30301,https://localhost:30301,http://localhost:3000"
  streamAgentOutput: "true"
  streamAgentTools: "true"
  streamAgentTokenStreaming: "true"
  controlMode: "daemon"
  executionBackend: "k8s"
  toolHitlMode: "enforce"

  # 2ENV operator tunables (optional; defaults in bootstrap/settings.py)
  jobCostPer1kTokensUsd: "0.003"
  defaultPersonaMaxToolCalls: "50"
  criticTrustThreshold: "0.5"
  criticDefaultConfidence: "0.5"
  reconcileSynthesisStaleMultiplier: "2.0"
  reconcileScanLimit: "50"
  workerTriageMaxAttempts: "2"
  workerMaxAttempts: "3"
  busSeenTtlSeconds: "300"
  kafkaConsumeTimeoutS: "1.0"
  httpConnectTimeoutS: "10"
  httpReadTimeoutS: "120"
  apiGaugeRefreshIntervalS: "30"
  apiReconcileIntervalS: "300"
  apiReconcileLeaderTtlS: "280"
  followUpMergeQueryLimit: "30"
  followUpMergeSummaryMax: "400"
  waybackApiTimeoutS: "20"
  egregoreMetricsPort: "9091"

obs:
  traceBackend: "composite"

prometheus:
  multiprocHostPath: ""

postgres:
  host: "postgres.cxado-data.svc.cluster.local"
  port: 5432
  user: postgres
  password: ""
  database: egregore

redis:
  host: "redis.cxado-data.svc.cluster.local"
  port: 6379
  password: ""

qdrant:
  url: "http://qdrant.cxado-data.svc.cluster.local:6333"

veil:
  mcpUrl: "http://veil-veil-mcp.veil.svc.cluster.local:8091/mcp"
  mcpEnabled: "true"

siem:
  mcpUrl: "http://siem-mcp.cxado-app.svc.cluster.local:8094/mcp"
  mcpEnabled: "true"
  mcpTimeout: "180"

nessus:
  mcpUrl: "http://tenable-mcp.cxado-app.svc.cluster.local:8095/mcp"
  mcpEnabled: "true"
  mcpTimeout: "180"

otel:
  endpoint: "http://tempo.cxado-obs.svc.cluster.local:4317"
  resourceAttributes: "deployment.environment=offline,k8s.namespace.name=cxado-app"
  tracesSampler: "parentbased_always_on"
  tracesSamplerArg: "1.0"

langfuse:
  enabled: true
  host: "http://langfuse-web.cxado-langfuse.svc.cluster.local:3000"
  publicKey: "pk-lf-egregore-dev-local"
  secretKey: "sk-lf-egregore-dev-local"

busSigningKey: ""
openfgaApiToken: ""

llm:
  provider: litellm
  model: openai/Kbenkhaled/Qwen3.5-27B-NVFP4
  baseUrl: http://10.8.185.185:11611/v1
  temperature: "0.1"
  reasoningModel: ""
  reasoningTemperature: "0.0"

resources:
  api:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  dispatcher:
    requests:
      cpu: 200m
      memory: 640Mi
    limits:
      cpu: 1200m
      memory: 1536Mi
  worker:
    requests:
      cpu: 200m
      memory: 640Mi
    limits:
      cpu: 1200m
      memory: 1536Mi
  toolGateway:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ui:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
