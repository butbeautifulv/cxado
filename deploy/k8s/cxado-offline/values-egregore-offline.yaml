image:
  repository: "__CXADO_IMAGE_REPO__"
  tag: "__CXADO_OFFLINE_TAG__"
  pullPolicy: IfNotPresent

ui:
  image:
    repository: "__CXADO_UI_IMAGE_REPO__"
    tag: "__CXADO_OFFLINE_TAG__"
    pullPolicy: IfNotPresent
  # Operator UI (Next.js) in cxado-app; bundle: k3s-offline-bundle-egregore-ui.sh
  replicas: 1
  # Offline images are imported via ctr on the control-plane only.
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

api:
  replicas: 1
  port: 8080
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

worker:
  # P30 single-node: steady 2 workers, HPA max 3 — see k3s-capacity-budget.md
  replicas: 2
  idleTimeout: 0
  metricsPort: 8081
  # Offline images imported via ctr on control-plane only; avoid ImagePullBackOff on corp workers.
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilization: 65

rollout:
  api:
    maxSurge: 1
    maxUnavailable: 0
  worker:
    # P30: no surge pod — replace one worker at a time to avoid quota/scheduling spikes
    maxSurge: 0
    maxUnavailable: 1

env:
  stage: prod
  useMemoryFallback: "false"
  useKafka: "true"
  kafkaBootstrapServers: "redpanda.cxado-data.svc.cluster.local:9092"
  useQdrant: "true"
  authEnabled: "false"
  authzMode: "off"

# Prod profile (enable via helm -f values-egregore-prod-auth.yaml):
#   authEnabled: "true"
#   authzMode: "shadow"
  openfgaApiUrl: ""
  openfgaStoreId: ""
  openfgaModelId: ""
  otelEnabled: "true"
  logLevel: "INFO"
  logFormat: "json"
  litellmLocalModelCostMap: "true"
  traceCriticEnabled: "false"
  llmRequestTimeout: "120"
  workerJobTimeout: "300"
  workerJobTimeoutIntel: "420"
  workerJobTimeoutSynth: "180"
  defaultJobRecursionLimit: "35"
  triageRecursionLimit: "22"
  maxPlannerPersonas: "2"
  jsonToolCallFallback: "true"
  manualInvestigationAsync: "true"
  uiCorsOrigins: "https://192.168.0.133:30300,https://10.8.185.15:30300,https://localhost:30300,https://192.168.0.133:30301,https://10.8.185.15:30301,https://localhost:30301,http://localhost:3000"
  streamAgentOutput: "true"
  streamAgentTools: "true"
  streamAgentTokenStreaming: "true"
  controlMode: "inprocess"

obs:
  traceBackend: "composite"

prometheus:
  # empty = per-pod emptyDir (Strategy A: scrape each worker /metrics).
  # Set host path only for documented Strategy B fallback — see egregore-worker-metrics-adr.md
  multiprocHostPath: ""

postgres:
  host: "postgres.cxado-data.svc.cluster.local"
  port: 5432
  user: postgres
  # password comes from egregore chart secret values
  password: ""
  database: egregore

redis:
  host: "redis.cxado-data.svc.cluster.local"
  port: 6379
  password: ""

qdrant:
  url: "http://qdrant.cxado-data.svc.cluster.local:6333"

veil:
  mcpUrl: "http://veil-veil-mcp.veil.svc.cluster.local:8091/mcp"
  mcpEnabled: "true"

siem:
  # In-cluster SIEM MCP (helm release siem-mcp in cxado-app)
  mcpUrl: "http://siem-mcp.cxado-app.svc.cluster.local:8094/mcp"
  mcpEnabled: "true"
  mcpTimeout: "180"

nessus:
  mcpUrl: "http://tenable-mcp.cxado-app.svc.cluster.local:8095/mcp"
  mcpEnabled: "true"
  mcpTimeout: "180"

otel:
  endpoint: "http://tempo.cxado-obs.svc.cluster.local:4317"
  resourceAttributes: "deployment.environment=offline,k8s.namespace.name=cxado-app"
  tracesSampler: "parentbased_always_on"
  tracesSamplerArg: "1.0"

langfuse:
  enabled: true
  host: "http://langfuse-web.cxado-langfuse.svc.cluster.local:3000"
  publicKey: "pk-lf-egregore-dev-local"
  secretKey: "sk-lf-egregore-dev-local"

busSigningKey: ""
openfgaApiToken: ""

llm:
  provider: litellm
  model: openai/Kbenkhaled/Qwen3.5-27B-NVFP4
  baseUrl: http://10.8.185.185:11611/v1
  temperature: "0.1"
  reasoningModel: ""
  reasoningTemperature: "0.0"

# Per-pod caps; HPA max 3 workers × limits ≈ 3.6 CPU / 4.5Gi for egregore workers alone.
resources:
  api:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  worker:
    requests:
      cpu: 200m
      memory: 640Mi
    limits:
      cpu: 1200m
      memory: 1536Mi
  ui:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
