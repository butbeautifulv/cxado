apiVersion: v1
kind: ConfigMap
metadata:
  name: cxado-arch-docs-nginx
  namespace: cxado-edge
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location ~* \.(mmd|js|css|html)$ {
        add_header Cache-Control "no-cache";
      }
    }
