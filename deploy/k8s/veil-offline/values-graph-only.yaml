global:
  # Images pulled from Nexus cxado-docker (see deploy/registry.defaults.env)
  imageRegistry: "__VEIL_IMAGE_REGISTRY__"
  imageTag: "__VEIL_OFFLINE_TAG__"
  natsUrl: "nats://nats.veil-data.svc:4222"
  neo4jUri: "neo4j://neo4j.veil-data.svc:7687"

# Graph read plane only
graph:
  api:
    enabled: true
    replicas: 1
    # Offline: images + skills-index hostPath live on control-plane only.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  mcp:
    enabled: true
    replicas: 1
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  ingress:
    enabled: false

# Disable engage plane for now (offline minimal)
engage:
  api:
    enabled: false
  mcp:
    enabled: false
  eventsWorker:
    enabled: false
  runner:
    enabled: false

# Keep worker deployments at 0 replicas for graph-only
pipeline:
  worker:
    replicas: 0
    hpa:
      enabled: false

ingest:
  worker:
    replicas: 0
    hpa:
      enabled: false

scrape:
  cronJob:
    enabled: false

observability:
  enabled: true
  otelEndpoint: "http://tempo.cxado-obs.svc.cluster.local:4317"
  samplerRatio: 1.0
  logFormat: json
  logLevel: info

playbooks:
  hostPath: /var/lib/veil/playbooks
  mountPath: /home/nonroot
  searchEngine: bleve
  searchMode: keyword

imagePullSecrets:
  - name: nexus-registry

