apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: veil-data
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: veil-data
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # Prevent Kubernetes service env var injection like NEO4J_PORT_7687_TCP_PORT,
      # which Neo4j can misinterpret as config keys (PORT.7687.TCP.PORT) and fail startup.
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: docker.io/library/neo4j:5.26.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              value: "none"
          ports:
            - containerPort: 7474
            - containerPort: 7687
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 6Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 40Gi

