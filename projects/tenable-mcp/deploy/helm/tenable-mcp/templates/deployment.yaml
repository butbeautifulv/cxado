apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenable-mcp.fullname" . }}
  labels:
    {{- include "tenable-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "tenable-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenable-mcp.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: tenable-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: NESSUS_DB_PATH
              value: {{ .Values.persistence.dbPath | quote }}
            - name: MCP_PORT
              value: {{ .Values.service.port | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: inventory-data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health?probe_nessus=true
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: inventory-data
          persistentVolumeClaim:
            claimName: {{ include "tenable-mcp.fullname" . }}-inventory
      {{- end }}
