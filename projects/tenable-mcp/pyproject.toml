[project]
name = "tenable-mcp"
version = "0.1.0"
description = "MCP server for local Nessus REST API with mini security CMDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "fastmcp>=2.12.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
tenable-mcp = "tenable_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenable_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/tenable_mcp", "docs", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
