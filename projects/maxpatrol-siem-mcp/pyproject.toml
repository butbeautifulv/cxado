[project]
name = "maxpatrol-siem-mcp"
version = "0.1.0"
description = "MCP server wrapping MaxPatrol 10 27.2 REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.12.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
maxpatrol-siem-mcp = "maxpatrol_siem_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxpatrol_siem_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/maxpatrol_siem_mcp", "docs", "scripts"]

[dependency-groups]
dev = [
    "html2text>=2024.2.26",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
