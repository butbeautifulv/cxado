# cxado corp k3s — Fabrica oss-full-enterprise + Egregore secure pipeline

stages:
  - validate
  - test
  - security
  - static-security-upload
  - build
  - image
  - supply-chain
  - image-security-upload
  - deploy
  - post-deploy
  - smoke

default:
  tags:
    - k3s
    - corp
    - p30

include:
  - local: '.gitlab/ci/oss-full-enterprise.gitlab-ci.yml'
  - local: '.gitlab/jobs/cxado/_variables.yml'
  - local: '.gitlab/jobs/cxado/submodule-init.yml'
  - local: '.gitlab/jobs/cxado/pip.yml'
  - local: '.gitlab/jobs/cxado/egregore-scope.yml'
  - local: '.gitlab/jobs/cxado/egregore-security.yml'
  - local: '.gitlab/jobs/cxado/egregore-test.yml'
  - local: '.gitlab/jobs/cxado/egregore-aspm.yml'
  - local: '.gitlab/jobs/cxado/egregore-supply-chain.yml'
  - local: '.gitlab/jobs/cxado/validate-helm.yml'
  - local: '.gitlab/jobs/cxado/kaniko-build-egregore.yml'
  - local: '.gitlab/jobs/cxado/deploy-egregore.yml'
  - local: '.gitlab/jobs/cxado/smoke-egregore.yml'

# --- Disable fabrica jobs replaced by cxado corp path ---
build-image:
  rules:
    - when: never

deploy-contour:
  rules:
    - when: never
  environment:
    name: cxado-contour-disabled
    url: https://10.8.185.15:30300

conftest-admission:
  rules:
    - when: never

sign-image:
  rules:
    - when: never
