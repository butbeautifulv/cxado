# QA — binary fuzz (AFL++, Go native fuzz, Jazzer)

binary-fuzz:
  extends: .oss_docker_job
  stage: test
  variables:
    FUZZ_TIME: "30"
    FUZZ_TARGETS: "auto"
    ASPM_CONTROL: binary_fuzz
    ASPM_REPORT: reports/binary-fuzz-junit.xml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  before_script:
    - apk add --no-cache python3 git bash make
    - !reference [.oss_docker_job, before_script]
  script:
    - chmod +x scripts/run-binary-fuzz.sh
    - bash scripts/run-binary-fuzz.sh "${CI_PROJECT_DIR}" reports/binary-fuzz-junit.xml
    - |
      python3 scripts/gate-check.py --control binary_fuzz --report reports/binary-fuzz-junit.xml \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}" || GATE_EXIT=$?
      exit ${GATE_EXIT:-0}
  after_script:
    - command -v python3 >/dev/null || apk add --no-cache python3
    - !reference [.aspm_export, after_script]
  artifacts:
    paths:
      - reports/binary-fuzz-junit.xml
      - examples/fuzzing/c/out
    expire_in: 30 days
  allow_failure: true
