# B3 — OSA (Trivy filesystem / dependency manifests)

.trivy_job:
  image:
    name: ${OSS_TRIVY_IMAGE:-aquasec/trivy:0.63.0}
    entrypoint: [""]
  before_script:
    - |
      if command -v apk >/dev/null 2>&1; then
        apk add --no-cache python3
      else
        apt-get update -qq && apt-get install -y -qq python3
      fi

trivy-osa:
  stage: security
  extends:
    - .workflow_rules_security
    - .security_job_defaults
    - .trivy_job
  script:
    - trivy fs . --scanners vuln --severity CRITICAL,HIGH --format sarif --output osa.sarif || true
    - |
      [ -f osa.sarif ] || echo '{"runs":[{"results":[]}]}' > osa.sarif
    - python3 scripts/gate-check.py --control osa --report osa.sarif \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  artifacts:
    paths:
      - osa.sarif
    expire_in: 30 days
