# B1 — Secret detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    expire_in: 30 days
  after_script:
    - |
      REPORT=gl-secret-detection-report.json
      [ -f "$REPORT" ] || echo '{"vulnerabilities":[]}' > "$REPORT"
      python scripts/gate-check.py --control secrets --report "$REPORT" \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  allow_failure: true
