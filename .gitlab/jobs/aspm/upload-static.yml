# ASPM upload wave — static findings (security stage)

.aspm_upload_static:
  stage: static-security-upload
  image: ${OSS_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
  extends:
    - .defectdojo_skip_rules
    - .security_job_defaults
  before_script:
    - pip install -q --index-url "${PIP_INDEX_URL:-https://pypi.org/simple}" --trusted-host "${PIP_TRUSTED_HOST:-pypi.org}" pyyaml
  script:
    - |
      REPORT="${ASPM_REPORT:?}"
      CONTROL="${ASPM_CONTROL:?}"
      if [ ! -f "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT not found (scan job skipped)"
        exit 0
      fi
      if [ ! -s "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT is empty"
        exit 0
      fi
      python3 scripts/aspm-export.py --control "$CONTROL" --report "$REPORT" --skip-empty

upload-gitleaks-to-dojo:
  extends: .aspm_upload_static
  variables:
    ASPM_CONTROL: secrets
    ASPM_REPORT: gitleaks.sarif
  needs:
    - job: gitleaks-scan
      artifacts: true
      optional: true

