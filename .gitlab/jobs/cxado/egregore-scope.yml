# Egregore product scope — submodule checkout before any product job.

variables:
  EGREGORE_ROOT: "projects/egregore"

.egregore_prepare:
  before_script:
    - |
      if ! command -v git >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache git ca-certificates
        else
          echo "git required but no apt-get/apk in image" >&2
          exit 2
        fi
      fi
    - ./scripts/gitlab/ci-submodule-init.sh
    - test -f "${EGREGORE_ROOT}/pyproject.toml" || (echo "egregore submodule missing" >&2; exit 2)
    - |
      if [ -n "${NEXUS_USER:-}" ] && [ -n "${NEXUS_PASSWORD:-}" ]; then
        printf 'machine %s\nlogin %s\npassword %s\n' \
          "${NEXUS_PYPI_HOST}" "${NEXUS_USER}" "${NEXUS_PASSWORD}" > ~/.netrc
        chmod 600 ~/.netrc
      fi

.egregore_blocker:
  allow_failure: false

.egregore_warn:
  allow_failure: true

.egregore_workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
