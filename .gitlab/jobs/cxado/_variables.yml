# Corp registry + OSS image mirrors — values from GitLab CI/CD vars (seed: setup-ci-variables.sh)
# Defaults: deploy/registry.defaults.env

variables:
  REGISTRY_BACKEND: "nexus"
  NEXUS_DOCKER_REGISTRY: "nexus.svo.aero:8345"
  NEXUS_CXADO_DOCKER_REPO: "cxado-docker"
  NEXUS_PYPI_HOST: "nexus.svo.aero:8443"
  NEXUS_PYPI_REPO: "srsips-pypi"
  REGISTRY_HOST: "nexus.svo.aero:8345"
  REGISTRY_REPOSITORY: "cxado-docker"
  REGISTRY_USER: "${NEXUS_USER}"
  REGISTRY_PASSWORD: "${NEXUS_PASSWORD}"
  CXADO_CI_REGISTRY: "${REGISTRY_HOST}/${REGISTRY_REPOSITORY}"
  HELM_CHART_PATH: "projects/egregore/deploy/helm/egregore"
  HELM_RELEASE: "egregore"
  HELM_NAMESPACE: "cxado-app"
  CXADO_IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  CXADO_IMAGE_REPO: "${CXADO_CI_REGISTRY}/egregore"
  CXADO_UI_IMAGE_REPO: "${CXADO_CI_REGISTRY}/egregore-ui"
  KANIKO_EXECUTOR_IMAGE: "${CXADO_CI_REGISTRY}/kaniko-executor:v1.23.2"
  GIT_SUBMODULE_STRATEGY: none
  GIT_SUBMODULE_FORCE_HTTPS: "false"
  GIT_DEPTH: "1"
  CI_SUBMODULE_GITLAB_PREFIX: "git@gitlab.svo.aero:av.popov"
  CI_SUBMODULES: "projects/egregore"
  CXADO_APP_NS: "cxado-app"
  PREPROD_URL: "https://10.8.185.15:30300"
  OSS_SEMGREP_IMAGE: "${CXADO_CI_REGISTRY}/semgrep:1.117.0"
  OSS_SYFT_IMAGE: "${CXADO_CI_REGISTRY}/syft:v1.20.0"
  OSS_TRIVY_IMAGE: "${CXADO_CI_REGISTRY}/trivy:0.63.0"
  OSS_GITLEAKS_IMAGE: "${CXADO_CI_REGISTRY}/gitleaks:v8.22.1"
  OSS_HADOLINT_IMAGE: "${CXADO_CI_REGISTRY}/hadolint:v2.12.0-alpine"
  OSS_CONFTEST_IMAGE: "${CXADO_CI_REGISTRY}/conftest:v0.56.0"
  OSS_HELM_IMAGE: "${CXADO_CI_REGISTRY}/helm:3.17.2"
  OSS_PYTHON_IMAGE: "${CXADO_CI_REGISTRY}/python:3.11.11-slim-bookworm"
  OSS_ALPINE_IMAGE: "${CXADO_CI_REGISTRY}/alpine:3.20.3"
  OSS_DOCKER_CLI_IMAGE: "${CXADO_CI_REGISTRY}/docker:24.0.9-cli"
  OSS_DOCKER_DIND_IMAGE: "${CXADO_CI_REGISTRY}/docker:24.0.9-dind"
  OSS_COSIGN_IMAGE: "${CXADO_CI_REGISTRY}/cosign:v2.4.0"
  CXADO_SMOKE_IMAGE: "${CXADO_CI_REGISTRY}/alpine:3.20.3"
  CXADO_KUBECTL_IMAGE: "${CXADO_CI_REGISTRY}/kubectl:1.32.2"
