# Shared Docker registry login — GitLab or external (Nexus/Harbor/Artifactory)

.registry_login:
  before_script:
    - source scripts/registry-resolve-env.sh
    - bash scripts/registry-login.sh

.registry_auth_env:
  before_script:
    - source scripts/registry-resolve-env.sh
    - source scripts/registry-auth-env.sh
