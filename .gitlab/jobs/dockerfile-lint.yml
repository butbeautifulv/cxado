# B5 — Dockerfile lint

dockerfile-lint:
  stage: security
  image: ${OSS_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
  extends:
    - .security_job_defaults
  variables:
    OSS_HADOLINT_IMAGE: ${OSS_HADOLINT_IMAGE:-hadolint/hadolint:v2.12.0-alpine}
  rules:
    - if: $SAST_DISABLED == 'true' || $SAST_DISABLED == '1' || $SECURITY_DISABLED == 'true' || $SECURITY_DISABLED == '1'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - Dockerfile.*
        - "**/Dockerfile"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
        - Dockerfile.*
        - "**/Dockerfile"
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
  script:
    - |
      echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"hadolint"}},"results":[]}]}' > hadolint.sarif
      echo '[]' > hadolint-report.json
      FAILED=0
      mapfile -t DOCKERFILES < <(find . \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) ! -path './.git/*')
      if [ "${#DOCKERFILES[@]}" -eq 0 ]; then
        echo "No Dockerfiles found"
      else
        for f in "${DOCKERFILES[@]}"; do
          echo "Linting $f"
          docker run --rm -i "${OSS_HADOLINT_IMAGE}" < "$f" || FAILED=1
        done
        python3 - <<'PY'
      import json
      import os
      import subprocess
      from pathlib import Path
      image = os.environ.get("OSS_HADOLINT_IMAGE", "hadolint/hadolint:v2.12.0-alpine")
      root = Path.cwd()
      items = []
      for f in root.rglob("Dockerfile*"):
          if ".git" in f.parts:
              continue
          rel = f.relative_to(root).as_posix()
          proc = subprocess.run(
              ["docker", "run", "--rm", "-v", f"{root}:/work", "-w", "/work", image, "-f", "json", f"/work/{rel}"],
              capture_output=True,
              text=True,
          )
          if not proc.stdout.strip():
              continue
          try:
              data = json.loads(proc.stdout)
              if isinstance(data, list):
                  items.extend(data)
          except json.JSONDecodeError:
              pass
      Path("hadolint-report.json").write_text(json.dumps(items))
      PY
      fi
      if [ "$FAILED" -eq 1 ]; then
        python3 - <<'PY'
      import json
      from pathlib import Path
      Path("hadolint.sarif").write_text(json.dumps({
        "version": "2.1.0",
        "runs": [{
          "tool": {"driver": {"name": "hadolint"}},
          "results": [{
            "level": "warning",
            "message": {"text": "Hadolint findings — see job log"},
            "locations": [{
              "physicalLocation": {
                "artifactLocation": {"uri": "Dockerfile", "uriBaseId": "%SRCROOT%"},
                "region": {"startLine": 1}
              }
            }]
          }]
        }]
      }))
      PY
      fi
      python3 scripts/normalize-sarif.py hadolint.sarif hadolint
    - python3 scripts/gate-check.py --control dockerfile --report hadolint.sarif \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  artifacts:
    paths:
      - hadolint.sarif
      - hadolint-report.json
    expire_in: 30 days
