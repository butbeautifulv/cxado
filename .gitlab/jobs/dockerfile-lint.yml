# B5 — Dockerfile lint (native hadolint, no DinD)

dockerfile-lint:
  stage: security
  image:
    name: ${OSS_HADOLINT_IMAGE:-hadolint/hadolint:v2.12.0-alpine}
    entrypoint: [""]
  extends:
    - .security_job_defaults
  rules:
    - if: $SAST_DISABLED == 'true' || $SAST_DISABLED == '1' || $SECURITY_DISABLED == 'true' || $SECURITY_DISABLED == '1'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - Dockerfile.*
        - "**/Dockerfile"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
        - Dockerfile.*
        - "**/Dockerfile"
  script:
    - |
      echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"hadolint"}},"results":[]}]}' > hadolint.sarif
      echo '[]' > hadolint-report.json
      FAILED=0
      mapfile -t DOCKERFILES < <(find . \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) ! -path './.git/*')
      if [ "${#DOCKERFILES[@]}" -eq 0 ]; then
        echo "No Dockerfiles found"
      else
        python3 - <<'PY'
      import json
      import subprocess
      from pathlib import Path

      root = Path.cwd()
      items = []
      failed = False
      for f in sorted(root.rglob("Dockerfile*")):
          if ".git" in f.parts:
              continue
          rel = f.relative_to(root).as_posix()
          print(f"Linting {rel}")
          proc = subprocess.run(
              ["hadolint", "-f", "json", str(f)],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              failed = True
          if not proc.stdout.strip():
              continue
          try:
              data = json.loads(proc.stdout)
              if isinstance(data, list):
                  items.extend(data)
          except json.JSONDecodeError:
              pass
      Path("hadolint-report.json").write_text(json.dumps(items))
      Path(".hadolint_failed").write_text("1" if failed else "0")
      PY
        FAILED=$(cat .hadolint_failed 2>/dev/null || echo 0)
        rm -f .hadolint_failed
      fi
      if [ "$FAILED" = "1" ]; then
        python3 - <<'PY'
      import json
      from pathlib import Path
      Path("hadolint.sarif").write_text(json.dumps({
        "version": "2.1.0",
        "runs": [{
          "tool": {"driver": {"name": "hadolint"}},
          "results": [{
            "level": "warning",
            "message": {"text": "Hadolint findings — see job log"},
            "locations": [{
              "physicalLocation": {
                "artifactLocation": {"uri": "Dockerfile", "uriBaseId": "%SRCROOT%"},
                "region": {"startLine": 1}
              }
            }]
          }]
        }]
      }))
      PY
      fi
      python3 scripts/normalize-sarif.py hadolint.sarif hadolint
    - python3 scripts/gate-check.py --control dockerfile --report hadolint.sarif \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  artifacts:
    paths:
      - hadolint.sarif
      - hadolint-report.json
    expire_in: 30 days
